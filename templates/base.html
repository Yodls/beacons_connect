<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Beacon{% endblock %}</title>
    <style>
      body {
        max-width: 22rem;
        margin: 4rem auto;
        padding: 0 1rem;
        font: 16px/1.5 system-ui, sans-serif;
      }
      label { display: block; margin-top: 1rem; }
      input { width: 100%; padding: 0.5rem; font-size: 1rem; }
      button { margin-top: 1.25rem; padding: 0.5rem 1rem; font-size: 1rem; }
      .flash { padding: 0.5rem; background: #fdecea; color: #611a15; }
      select { width: 100%; padding: 0.5rem; font-size: 1rem; }
      fieldset { margin-top: 1.5rem; padding: 0 1rem 1rem; border: 1px solid #ddd; }
      legend { padding: 0 0.25rem; font-weight: 600; }
      fieldset label { margin-top: 0.4rem; }
      input[type="checkbox"], input[type="radio"] { width: auto; margin-right: 0.5rem; }
      h2 { margin-top: 2rem; font-size: 1.1rem; }
      .card { margin-top: 0.75rem; padding: 0.75rem 1rem; border: 1px solid #ddd; }
      .card h3 { margin: 0; font-size: 1rem; }
      .score { float: right; color: #555; font-variant-numeric: tabular-nums; }
      .why { margin: 0.35rem 0 0; color: #555; font-size: 0.9rem; }
      .actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; }
      .actions form { margin: 0; }
      .actions button { margin-top: 0; padding: 0.3rem 0.7rem; font-size: 0.85rem; }
      .actions button[disabled] { color: #999; border-style: dashed; }
      .nav { margin-top: 2rem; color: #555; font-size: 0.9rem; }
      {% block style %}{% endblock %}
    </style>
  </head>
  <body>
    {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </body>
</html>
