{% extends "base.html" %}

{% block style %}body { max-width: 52rem; }
{% block appstyle %}{% endblock %}
{% endblock %}

{% block content %}
  <div class="shell">
    <main>
      {% block main %}{% endblock %}
    </main>

    <div class="side">
      <details class="menu">
        <summary>&#9776;</summary>
        <a href="{{ url_for('matches') }}">Matches &amp; clubs</a>
        <a href="{{ url_for('clubs') }}">Browse all clubs</a>
        <a href="{{ url_for('logout') }}">Sign out</a>
      </details>

      {% block sidebuttons %}
        <form method="get" action="{{ url_for('find_game') }}" style="margin:0">
          <button type="submit">Find a Game</button>
        </form>
        <form method="get" action="{{ url_for('game_lobby') }}" style="margin:0">
          <button type="submit">Play a Game</button>
        </form>
        <form method="get" action="{{ url_for('chat', kind='community', target_id=0) }}" style="margin:0">
          <button type="submit">Who's looking for a game</button>
        </form>
        <button type="button" disabled>Maps</button>
      {% endblock %}
    </div>
  </div>
{% endblock %}
