{% extends "base.html" %}
{% block title %}Create account{% endblock %}

{% block content %}
  <h1>Create account</h1>
  <form method="post">
    <label>Your name <input name="name" maxlength="120" required autofocus /></label>
    <label>Gender
      <select name="gender" required>
        <option value="">Choose one</option>
        {% for slug, label in genders.items() %}
          <option value="{{ slug }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    {# Not required: "Prefer not to say" starts selected, so leaving it alone
       is itself an answer. Changeable later on /onboarding. #}
    <label>Pronouns
      <select name="pronouns">
        {% for slug, label in pronoun_options.items() %}
          <option value="{{ slug }}"
                  {% if slug == "unspecified" %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Email <input type="email" name="email" required /></label>
    <label>Password <input type="password" name="password" required /></label>
    <label>Confirm password <input type="password" name="confirm_password" required /></label>
    <button type="submit">Create account</button>
  </form>
  <p>Already have one? <a href="{{ url_for('login') }}">Sign in</a>.</p>
{% endblock %}
