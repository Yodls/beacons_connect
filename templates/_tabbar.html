{#
  The bottom nav.

  Called .tabbar, not .dock: that class belongs to the friends panel and is
  pinned byte-for-byte by its tests.

  These are anchors rather than the mockup's <button>s, deliberately. The
  browser harness navigates by real hrefs, so this is what makes /, the
  community room and the rest reachable from every page.

  Slot 2 is the friends panel itself rather than a link. It used to be an
  <a href="/matches"> sitting a few pixels from the panel's own floating chip,
  which was both redundant and in the way; the panel now opens from this slot
  and carries the link to /matches inside it. That makes the panel the only
  thing here that renders data -- and the dock's trailing <script> is
  display:none, so six grid cells still hold six visible slots.
#}
{%- import "_ui.html" as ui -%}
{%- set here = request.endpoint -%}
<nav class="tabbar" aria-label="Sections">
  <a class="tab sec-chat {% if here == 'index' %}on{% endif %}"
     href="{{ url_for('index') }}">{{ ui.icon("home") }}Home</a>

  {% include "_dock.html" %}

  <a class="tab sec-game {% if here == 'game_lobby' %}on{% endif %}"
     href="{{ url_for('game_lobby') }}">{{ ui.icon("game") }}Games</a>

  {# No label on purpose, as in the mockup. It also keeps the room's own
     title off every page. #}
  <a class="tab-new" href="{{ url_for('chat', kind='community', target_id=0) }}"
     aria-label="Post to the community room">{{ ui.icon("plus") }}</a>

  <a class="tab sec-place {% if here == 'find_game' %}on{% endif %}"
     href="{{ url_for('find_game') }}">{{ ui.icon("meet") }}Meet up</a>

  <a class="tab sec-club {% if here == 'clubs' %}on{% endif %}"
     href="{{ url_for('clubs') }}">{{ ui.icon("club") }}Clubs</a>
</nav>
