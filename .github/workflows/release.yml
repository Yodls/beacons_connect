name: Promote tag to production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ steps.app-token.outputs.token }}

      - name: Make sure the tag is on main
        run: |
          SHA=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($SHA) is not on main; refusing to promote it."
            exit 1
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Move production to the tag
        run: |
          git push --force origin "$SHA:refs/heads/production"
          echo "### production → $GITHUB_REF_NAME (\`${SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
